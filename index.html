<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Serendipity Archive</title>
<style>
  :root{
    --vermillion:#E3401F;
    --vermillion-deep:#C22F13;
    --ink:#241505;
    --cream:#FBF3E7;
    --gold:#D9A441;
    --card-shadow: rgba(36,21,5,0.35);
  }

  *{box-sizing:border-box;}

  html{scroll-behavior:smooth;}

  body{
    margin:0;
    background:var(--vermillion);
    background-image:
      radial-gradient(circle at 12% 8%, rgba(255,255,255,0.05), transparent 40%),
      radial-gradient(circle at 88% 92%, rgba(0,0,0,0.08), transparent 45%);
    color:var(--cream);
    font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;
    min-height:100vh;
  }

  /* header */
  header{
    position:relative;
    padding:28px 24px 18px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .corner-link{
    position:absolute;
    top:22px;
    width:38px;
    height:38px;
    border-radius:50%;
    background:var(--cream);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 3px 8px var(--card-shadow);
    transition:transform .2s ease, box-shadow .2s ease;
    text-decoration:none;
  }
  .corner-link:hover{
    transform:translateY(-2px) scale(1.06);
    box-shadow:0 6px 14px var(--card-shadow);
  }
  .corner-link.cosmos{ left:24px; }
  .corner-link.pinterest{ right:24px; }
  .corner-link img,
  .corner-link svg{
    width:20px;
    height:20px;
  }

  .title-block{
    text-align:center;
  }

  .eyebrow{
    display:block;
    font-size:11px;
    letter-spacing:0.32em;
    text-transform:uppercase;
    color:rgba(251,243,231,0.75);
    margin-bottom:6px;
  }

  h1{
    margin:0;
    font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight:700;
    font-size:clamp(32px, 6vw, 58px);
    letter-spacing:-0.02em;
    color:var(--cream);
  }

  .subtitle{
    margin:10px 0 0;
    font-size:14px;
    color:rgba(251,243,231,0.8);
    letter-spacing:0.02em;
  }

  /* grid */
  main{
    max-width:1180px;
    margin:0 auto;
    padding:36px 24px 80px;
  }

  .gallery{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));
    gap:22px;
  }

  figure{
    margin:0;
    background:var(--cream);
    border-radius:4px;
    overflow:hidden;
    box-shadow:0 8px 20px var(--card-shadow);
    position:relative;
    transition:transform .25s ease, box-shadow .25s ease;
  }
  figure:hover{
    transform:translateY(-4px);
    box-shadow:0 14px 28px rgba(36,21,5,0.45);
  }

  .frame{
    position:relative;
    width:100%;
    aspect-ratio:4/5;
    overflow:hidden;
    background:#00000010;
  }
  .frame img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    filter:saturate(1.02);
  }

  .tag{
    position:absolute;
    top:10px;
    left:-6px;
    background:var(--vermillion-deep);
    color:var(--cream);
    font-size:11px;
    letter-spacing:0.06em;
    padding:3px 10px 3px 12px;
    border-radius:0 3px 3px 0;
    box-shadow:0 2px 5px rgba(0,0,0,0.25);
  }

  figcaption{
    padding:12px 14px 16px;
    color:var(--ink);
  }
  figcaption .work-title{
    display:block;
    font-weight:700;
    font-size:14px;
    letter-spacing:-0.01em;
    margin-bottom:2px;
  }
  figcaption .work-meta{
    display:block;
    font-size:12px;
    color:#5c4a34;
    font-family:Georgia, "Times New Roman", serif;
    font-style:italic;
  }

  footer{
    text-align:center;
    padding:24px;
    font-size:11px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:rgba(251,243,231,0.6);
  }

  /* work detail */
  .modal-backdrop{
    position:fixed;
    inset:0;
    z-index:1000;
    align-items:center;
    padding:28px;
    background:rgba(20,10,4,0,68);
    backdrop-filter:blur(5px);
    -webkit-backdrop-filter:blur(5px);
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transition:opacity .25s ease, visibility .25s ease;
  }

  .modal-backdrop.is-open{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
  }

  .work-modal{
    position:relative;
    width:min(1080px, 100%);
    max-height:min(820px, calc(100vh - 56px));
    display:grid;
    grid-template-columns:minmax(0, 1.08fr) minmax(300px, .92fr);
    overflow:hidden;
    background:var(--cream);
    color:var(--ink);
    border-radius:4px;
    box-shadow:0 24px 70px rgba(0,0,0,.48);
    transform:translateY(18px) scale(.985);
    transition:transform .28 ease;
  }

  .modal-backdrop.is-open .work-modal{
    transform:translateY(0) scale(1);
  }

  .modal-image-wrap{
    min-height:520px;
    background:#18100a;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }

  .modal-image{
    width:100%;
    height:100%;
    max-height:calc(100vh - 56px);
    object-fit:contain;
    display:block;
  }

  .modal-info{
    position:relative;
    overflow:auto;
    padding:48px 42px 42px;
    display:flex;
    flex-direction:column;
  }

  .modal-number{
    font-size:11px;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--vermillion-deep);
    margin-bottom:22px;
    font-weight:700;
  }

  .modal-title{
    margin:0 0 8px;
    font-size:clamp(28px, 4vw, 46px);
    line-height:1.02;
    letter-spacing: -.025em;
    color:var(--ink);
  }

  .modal-meta{
    margin:0 0 30px;
    font-family:Georgia, "Times New Roman", serif;
    font-style:italic;
    font-size:14px;
    color:#5c4a34;
  }

  .modal-divider{
    width:46px;
    height:3px;
    margin-bottom:26px;
    background:var(--vermillion);
  }

  .modal-description{
    margin:0;
    font-size:15px;
    line-height:1.75;
    color:#3b2b1b;
    white-space:pre-line;
  }

  .modal-close{
    position:absolute;
    top:14px;
    right:14px;
    z-index:2;
    width:38px;
    height:38px;
    border:0;
    border-radius:50%;
    background:var(--cream);
    color:var(--ink);
    font-size:24px;
    line-height:1;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 3px 10px rgba(0,0,0,.22);
    transition:transform .2s ease, background .2s ease;
  }

  .modal-close:hover{
    transform:scale(1.07);
    background:#ffffff;
  }

  figure[role="button"]{
    cursor:pointer;
  }

  figure:focus-visible{
    outline:3px solid var(--gold);
    outline-offset:4px;
  }

  @media (max-width:760px){
    .modal-backdrop{
      padding:14px;
      align-items:center;
    }

    .work-modal{
      grid-template-columns:1fr;
      max-height:calc(100vh - 28px);
      overflow:auto;
    }

    .modal-image-wrap{
      min-height:0;
      height:min(62vh, 620px);
    }

    .modal-image{
      max-height:none;
    }

    .modal-info{
      padding:30px 24px 32px;
    }

    .modal-title{
      font-size:32px;
    }

    .modal-close{
      top:10px;
      right:10px;
    }
  }

  @media (prefers-reduced-motion: reduce){
    .modal-backdrop,
    .work-modal,
    .corner-link,
    figure{
      transition:none;
    }
  }

  @media (prefers-reduced-motion: reduce){
    figure, .corner-link{ transition:none; }
  }
</style>
</head>
<body>

<header>
  
  <div class="title-block">
    <span class="eyebrow">PERSONAL CATALOGUE &middot; HAPISSPT</span>
    <h1>Serendipity Archive</h1>
    <p class="subtitle">BEST OF 2026</p>
  </div>

</header>

<main>
  <div class="gallery" id="gallery"></div>
</main>

<div class="modal-backdrop" id="workModal" aria-hidden="true">
  <section class="work-modal"
           role="dialog"
           aria-modal="true"
           aria-labelledby="modalTitle">

    <button class="modal-close" id="modalClose" type="button" aria-label="Tutup">&times;</button>

    <div class="modal-image-wrap">
      <img class="modal-image" id="modalImage" src="" alt="">
    </div>

    <div class="modal-info">
      <div class="modal-number" id="modalNumber"></div>
      <h2 class="modal-title" id="modalTitle"></h2>
      <p class="modal-meta" id="modalMeta"></p>
      <div class="modal-divider"></div>
      <p class="modal-description" id="modalDescription"></p>
    </div>

  </section>
</div>

<footer>SPT &middot; UPTD</footer>

<script>
  const works = [
    {
      src: "sankarea.jpg",
      title: "SANKAREA",
      medium: "beloved undead",
      year: "2026",
      description: "Made with pride and honor for the amazing Sankarea series, yellowish tone with black sillhouette, and a touch of red to represent the undead love star",
    },
    {
      src: "hanekawa.jpg",
      title: "HANEKAWA",
      medium: "intelligent mademoiselle",
      year: "2026",
      description: "Dedicated poster for the series Kizumonogatari sequel Nekettsu—hen, preserving the greatest character and the most impactful character in the whole series. The main pose is to represent how hungry she was about information.",
    },
    {
      src: "albumpicks.jpg",
      title: "ALBUMS",
      medium: "honored albums",
      year: "2026",
      description: "This poster represents my musical taste, featuring my top five album picks.",
    },
    {
      src: "madoka.jpg",
      title: "YUZUHARA MADOKA",
      medium: "stereotypes kills society",
      year: "2026",
      description: "This poster was created purely to express my unease regarding the individual perspective of judging something or someone based solely on appearance."
    },
    {
      src: "gentildonna.jpg",
      title: "GENTILDONNA",
      medium: "elegance meets performance",
      year: "2026",
      description: "To celebrate the precious title Triple Tiara Gentildonna has, this dedicated poster is made to represent her elegance and to promote her achivements in racing history.",
    },
    {
      src: "schooldays.jpg",
      title: "SCHOOLDAYS",
      medium: "contextual",
      year: "2026",
      description: "This poster simply spread awareness that every action has a consequences.",
    },
    {
      src: "bouquetdor.jpg",
      title: "CURREN BOUQUETD'OR",
      medium: "silver collector",
      year: "2026",
      description: "Beauty upon the harsh racetrack, bouquetd'or is showing magnificent performance and shows the world that shes blooming among the giants.",
    },
    {
      src: "bill.jpg",
      title: "BLACK SOULS",
      medium: "bill",
      year: "2026",
      description: "Dedicated to my favorite JRPG games.",
    },
    {
      src: "yor.jpg",
      title: "YOR FORGER",
      medium: "your ideal mother",
      year: "2026",
      description: "Honored poster just to represents the beauty of Yor Forger.",
    },
    {
      src: "marriagetoxin.jpg",
      title: "KINOSAKI",
      medium: "steal the looks",
      year: "2026",
      description: "Unofficial Marriage Toxin poster, this poster shows how beauty can break your mind.",
    },
    {
      src: "senjougahara.jpg",
      title: "HITAGI",
      medium: "sharp tongue",
      year: "2026",
      description: "This is not a poster, this is a magazine cover that inspired me to start a little project to make a magazine about how success her marriage is.",
    },
    {
      src: "urabe.jpg",
      title: "URABE",
      medium: "mysterious",
      year: "2026",
      description: "You can't judge someone by looking at her looks, you need to understand whats behind that hair bangs. Dedicated poster for the series Nazo no Kanojo X or Mysterious Girlfriend X.",
    }
  ];

  const gallery = document.getElementById("gallery");

  const modal = document.getElementById("workModal");
  const modalImage = document.getElementById("modalImage");
  const modalNumber = document.getElementById("modalNumber");
  const modalTitle = document.getElementById("modalTitle");
  const modalMeta = document.getElementById("modalMeta");
  const modalDescription = document.getElementById("modalDescription");
  const modalClose = document.getElementById("modalClose");

  let lastFocusedElement = null;

  function openWork(index){
    const w = works[index];
    const num = String(index + 1).padStart(3, "0");

    modalImage.src = w.src;
    modalImage.alt = w.title;
    modalNumber.textContent = `Archive No. ${num}`;
    modalTitle.textContent = w.title;
    modalMeta.textContent = `${w.medium}, ${w.year}`;
    modalDescription.textContent = w.description || "Belum ada deskripsi untuk karya ini.";

    lastFocusedElement = document.activeElement;

    modal.classList.add("is-open");
    modal.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";

    modalClose.focus();
  }

  function closeWork(){
    modal.classList.remove("is-open");
    modal.setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";

    if (lastFocusedElement){
      lastFocusedElement.focus();
    }
  }

  works.forEach((w, i) => {
    const num = String(i + 1).padStart(3, "0");
    const fig = document.createElement("figure");

    fig.setAttribute("role", "button");
    fig.setAttribute("tabindex", "0");
    fig.setAttribute("aria-label", `Lihat detail ${w.title}`);

    fig.innerHTML = `
      <div class="frame">
        <span class="tag">No. ${num}</span>
        <img src="${w.src}" alt="${w.title}" loading="lazy">
      </div>
      <figcaption>
        <span class="work-title">${w.title}</span>
        <span class="work-meta">${w.medium}, ${w.year}</span>
      </figcaption>
    `;

    fig.addEventListener("click", () => openWork(i));

    fig.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " "){
        event.preventDefault();
        openWork(i);
      }
    });

    gallery.appendChild(fig);
  });

  modalClose.addEventListener("click", closeWork);

  modal.addEventListener("click", (event) => {
    if (event.target === modal){
      closeWork();
    }
  });

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && modal.classList.contains("is-open")){
      closeWork();
    }
  });
</script>

</body>
</html>
